version: '3.8'

services:
  db:
    image: postgres:15
    container_name: activachilecito_db
    environment:
      POSTGRES_DB: activachilecito
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:

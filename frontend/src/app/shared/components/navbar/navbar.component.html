<nav class="navbar navbar-expand-lg modern-navbar fixed-top w-100 z-max" 
     [class.scrolled]="isScrolled" 
     *ngIf="!isAuthPage">
  <div class="container-fluid px-4 px-lg-5">
    
    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center py-0" routerLink="/">
      <img src="/images/logo.png" alt="Activa Chilecito" height="55" class="brand-logo-img drop-shadow-glow">
    </a>
    
    <!-- Toggler for mobile -->
    <button class="navbar-toggler text-theme border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <i class="bi bi-list fs-1 text-theme"></i>
    </button>
    
    <!-- Navbar Content -->
    <div class="collapse navbar-collapse" id="navbarNav">
      
      <!-- Center Navigation Links (Pill layout for desktop) -->
      <div class="nav-pill-container mx-auto mt-4 mt-lg-0">
        <ul class="navbar-nav mb-2 mb-lg-0 fw-bold gap-1 gap-lg-3">
          <li class="nav-item">
            <a class="nav-link text-theme px-3 rounded-pill" href="#jugadores">Jugadores / Visitantes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-theme px-3 rounded-pill" routerLink="/complejos">Para complejos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-theme px-3 rounded-pill" routerLink="/reservar">Reservas de canchas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-theme px-3 rounded-pill" href="#">Nosotros</a>
          </li>
        </ul>
      </div>

      <!-- Right Side User Actions -->
      <ul class="navbar-nav ms-auto align-items-center" *ngIf="authService.currentUser$ | async as user; else noAuth">
        <!-- Theme Toggle -->
        <li class="nav-item px-3 me-2">
          <button class="btn btn-link text-theme p-0 text-decoration-none theme-toggle-btn" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
            <span class="fs-5">{{ isDarkMode ? '☀️' : '🌙' }}</span>
          </button>
        </li>
        <li class="nav-item">
          <span class="nav-link text-theme fw-medium me-3">
            <i class="bi bi-person-circle text-brand-lime"></i> {{ user.email }}
          </span>
        </li>
        <li class="nav-item">
          <a class="nav-link text-theme fw-medium" routerLink="/dashboard">Panel</a>
        </li>
        <li class="nav-item ms-3 mt-3 mt-lg-0">
          <button class="btn btn-outline-theme btn-pill px-4 fw-bold" (click)="logout($event)">
            Salir
          </button>
        </li>
      </ul>
      
      <!-- Unauthenticated State -->
      <ng-template #noAuth>
        <div class="d-flex flex-column flex-lg-row align-items-center gap-4 ms-auto mt-3 mt-lg-0">
          <button class="btn btn-link text-theme p-0 text-decoration-none theme-toggle-btn" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
            <span class="fs-5">{{ isDarkMode ? '☀️' : '🌙' }}</span>
          </button>
          
          <a class="text-theme fw-bold text-decoration-none nav-link p-0" routerLink="/login">Iniciar sesión</a>
          <a class="btn btn-brand-lime btn-pill fw-bold" routerLink="/register">Registrarme</a>
        </div>
      </ng-template>

    </div>
  </div>
</nav>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">
      <i class="bi bi-activity"></i> Activa Chilecito
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto" *ngIf="authService.currentUser$ | async as user; else noAuth">
        
        <li class="nav-item">
          <span class="nav-link text-light me-3">
            <i class="bi bi-person-circle"></i> {{ user.email }} ({{ user.rol }})
          </span>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/perfil" routerLinkActive="active">Mi Perfil</a>
        </li>
        
        <li class="nav-item" *ngIf="user.rol === 'SUPERUSUARIO'">
          <a class="nav-link" routerLink="/admin/usuarios" routerLinkActive="active">
            <i class="bi bi-people"></i> Usuarios
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-warning ms-2" href="#" (click)="logout($event)">
            <i class="bi bi-box-arrow-right"></i> Salir
          </a>
        </li>
      </ul>
      
      <ng-template #noAuth>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Ingresar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active">Registrarse</a>
          </li>
        </ul>
      </ng-template>
    </div>
  </div>

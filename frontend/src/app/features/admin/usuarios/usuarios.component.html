<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Administración de Usuarios</h2>
    <button class="btn btn-outline-primary" (click)="cargarUsuarios()">Actualizar <i class="bi bi-arrow-clockwise"></i></button>
  </div>

  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div class="card shadow-sm" *ngIf="!isLoading">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nombre Completo</th>
              <th>Email</th>
              <th>Estado</th>
              <th>Rol</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let u of usuarios">
              <td>#{{ u.idUsuario }}</td>
              <td>{{ u.nombre }} {{ u.apellido }}</td>
              <td>{{ u.email }}</td>
              <td>
                <span class="badge" [ngClass]="u.estado === 'ACTIVO' ? 'bg-success' : 'bg-danger'">
                  {{ u.estado }}
                </span>
              </td>
              <td>
                <select class="form-select form-select-sm" [value]="u.rol" (change)="cambiarRol(u.idUsuario, $event)">
                  <option *ngFor="let rol of roles" [value]="rol">{{ rol }}</option>
                </select>
              </td>
              <td class="text-end">
                <button *ngIf="u.estado === 'SUSPENDIDO'" class="btn btn-sm btn-success me-2" (click)="activarUsuario(u.idUsuario)" title="Activar">
                  <i class="bi bi-check-circle"></i> Activar
                </button>
                <button *ngIf="u.estado === 'ACTIVO'" class="btn btn-sm btn-danger me-2" (click)="suspenderUsuario(u.idUsuario)" title="Suspender">
                  <i class="bi bi-slash-circle"></i> Suspender
                </button>
              </td>
            </tr>
            <tr *ngIf="usuarios.length === 0">
              <td colspan="6" class="text-center py-4 text-muted">No se encontraron usuarios.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

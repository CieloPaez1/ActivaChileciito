<div class="registro-container">
  <div class="card">
    <div class="card-header">
      <h2>Crear Cuenta</h2>
      <p>Únete a la plataforma ActivaChilecito</p>
    </div>

    <div *ngIf="mensaje" class="alert alert-success">
      {{ mensaje }}
    </div>
    
    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="registro-form">
      
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" formControlName="nombre" placeholder="Ej: Cielo" 
                 [class.invalid]="registroForm.get('nombre')?.invalid && registroForm.get('nombre')?.touched">
        </div>

        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" formControlName="apellido" placeholder="Ej: Paez"
                 [class.invalid]="registroForm.get('apellido')?.invalid && registroForm.get('apellido')?.touched">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="cielo@ejemplo.com"
               [class.invalid]="registroForm.get('email')?.invalid && registroForm.get('email')?.touched">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" formControlName="password" placeholder="Mínimo 6 caracteres"
                 [class.invalid]="registroForm.get('password')?.invalid && registroForm.get('password')?.touched">
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="text" id="telefono" formControlName="telefono" placeholder="Ej: 3825..."
                 [class.invalid]="registroForm.get('telefono')?.invalid && registroForm.get('telefono')?.touched">
        </div>
      </div>

      <div class="form-group">
        <label for="rol">Perfil de Usuario</label>
        <select id="rol" formControlName="rol">
          <option *ngFor="let rol of roles" [value]="rol">{{ rol }}</option>
        </select>
      </div>

      <button type="submit" class="btn-primary" [disabled]="registroForm.invalid || isSubmitting">
        <span *ngIf="!isSubmitting">Registrarse</span>
        <span *ngIf="isSubmitting" class="loader"></span>
      </button>

    </form>
  </div>
</div>

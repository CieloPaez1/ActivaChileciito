<div class="auth-page-wrapper d-flex justify-content-center align-items-center">
  <div class="glass-card d-flex flex-column align-items-center justify-content-center text-center p-5 position-relative">
    
    <a routerLink="/login" class="back-link">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Volver
    </a>

    <div class="logo-pill-center mb-4">
      <img src="/images/logo.png" alt="Activa Chilecito" class="overlay-logo drop-shadow-glow" style="height: 50px;">
    </div>
    
    <h2 class="form-title mb-2 text-white">Recuperar contraseña</h2>
    <p class="text-white-50 mb-4" style="font-size: 0.95rem; max-width: 350px;">
      Ingresa tu correo electrónico y te enviaremos un enlace seguro para restablecer tu contraseña.
    </p>

    <div *ngIf="successMessage" class="alert alert-success p-3 mb-4 w-100 shadow-sm" style="font-size: 0.9rem; border-radius: 12px; background: rgba(25, 135, 84, 0.2); color: #fff; border: 1px solid rgba(25, 135, 84, 0.5);">
      ✅ {{ successMessage }}
    </div>
    
    <div *ngIf="errorMessage" class="alert alert-danger p-3 mb-4 w-100 shadow-sm" style="font-size: 0.9rem; border-radius: 12px; background: rgba(220, 53, 69, 0.2); color: #fff; border: 1px solid rgba(220, 53, 69, 0.5);">
      ❌ {{ errorMessage }}
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="w-100" style="max-width: 350px;" *ngIf="!successMessage">
      <div class="input-group-custom mb-4 text-start">
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        <input type="email" placeholder="Correo electrónico" formControlName="email" class="w-100" />
      </div>

      <button type="submit" class="btn-solid w-100" [disabled]="forgotForm.invalid || isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ isSubmitting ? 'ENVIANDO...' : 'ENVIAR ENLACE' }}
      </button>
    </form>
    
  </div>
</div>

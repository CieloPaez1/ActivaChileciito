<div class="auth-page-wrapper d-flex justify-content-center align-items-center">
  <div class="glass-card d-flex flex-column align-items-center justify-content-center text-center p-5 position-relative">
    
    <a routerLink="/login" class="back-link">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Volver al Login
    </a>

    <div class="logo-pill-center mb-4">
      <img src="/images/logo.png" alt="Activa Chilecito" class="overlay-logo drop-shadow-glow" style="height: 50px;">
    </div>
    
    <h2 class="form-title mb-2 text-white">Nueva contraseña</h2>
    <p class="text-white-50 mb-4" style="font-size: 0.95rem; max-width: 350px;">
      Ingresa tu nueva contraseña para actualizar el acceso a tu cuenta.
    </p>

    <div *ngIf="successMessage" class="alert alert-success p-3 mb-4 w-100 shadow-sm" style="font-size: 0.9rem; border-radius: 12px; background: rgba(25, 135, 84, 0.2); color: #fff; border: 1px solid rgba(25, 135, 84, 0.5);">
      ✅ {{ successMessage }}
    </div>
    
    <div *ngIf="errorMessage" class="alert alert-danger p-3 mb-4 w-100 shadow-sm" style="font-size: 0.9rem; border-radius: 12px; background: rgba(220, 53, 69, 0.2); color: #fff; border: 1px solid rgba(220, 53, 69, 0.5);">
      ❌ {{ errorMessage }}
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="w-100" style="max-width: 350px;" *ngIf="!successMessage && token">
      <div class="input-group-custom mb-3 text-start">
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <input [type]="showPassword ? 'text' : 'password'" placeholder="Nueva contraseña" formControlName="nuevaClave" class="w-100" />
        <button type="button" class="password-toggle" (click)="toggleShowPassword()">
          <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
      </div>

      <div class="input-group-custom mb-3 text-start">
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <input [type]="showConfirmPassword ? 'text' : 'password'" placeholder="Confirmar contraseña" formControlName="confirmarClave" class="w-100" />
        <button type="button" class="password-toggle" (click)="toggleShowConfirmPassword()">
          <svg *ngIf="!showConfirmPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg *ngIf="showConfirmPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
      </div>

      <div *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmarClave')?.touched" class="text-danger w-100 text-start mb-3" style="font-size: 0.8rem;">
        * Las contraseñas no coinciden.
      </div>

      <button type="submit" class="btn-solid w-100 mt-2" [disabled]="resetForm.invalid || isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ isSubmitting ? 'GUARDANDO...' : 'GUARDAR CONTRASEÑA' }}
      </button>
    </form>
    
  </div>
</div>
